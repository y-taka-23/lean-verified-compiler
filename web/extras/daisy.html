<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daisy Bell</title>
<style>
  :root {
    --bg: #0b0d12;
    --fg: #e6e8ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  canvas {
    display: block;
    width: 100%;
    max-width: 960px;
    aspect-ratio: 8 / 5;
    border-radius: 8px;
    background: #000;
    cursor: pointer;
  }
  .err { max-width: 960px; color: #ff7070; white-space: pre-wrap; font-size: 0.85rem; margin: 0; }
</style>
</head>
<body>
  <canvas id="cv" width="960" height="600"></canvas>
  <p class="err" id="err"></p>

<script type="module">
const WASM_URL = "../../out/daisy.wasm";
const SR = 32768;
const W = 960, H = 600;

let bytes;
try {
  const res = await fetch(WASM_URL);
  if (!res.ok) throw new Error(`${WASM_URL} を読み込めません (${res.status})`);
  bytes = await res.arrayBuffer();
} catch (e) {
  document.getElementById("err").textContent =
    `${e.message}\nリポジトリのルートで lake exe extras と wat2wasm out/daisy.wat -o out/daisy.wasm を実行し、python3 -m http.server で配信してから web/extras/daisy.html を開いてください。`;
  throw e;
}

// main(out, mode, t, 作業用変数...)：mode 0 で時刻 t のサンプル、mode 1 で曲の長さ
const PROCESSOR = `
class Daisy extends AudioWorkletProcessor {
  constructor(options) {
    super();
    const { main } = new WebAssembly.Instance(new WebAssembly.Module(options.processorOptions.bytes)).exports;
    this.args = new Array(main.length).fill(0);
    this.main = main;
    this.args[1] = 1;
    this.n = main(...this.args);
    this.args[1] = 0;
    this.t = 0;
  }
  process(_, outputs) {
    const ch = outputs[0][0], args = this.args;
    for (let i = 0; i < ch.length; i++) {
      args[2] = this.t;
      ch[i] = this.main.apply(null, args) / 32768;
      this.t = (this.t + 1) % this.n;
    }
    return true;
  }
}
registerProcessor("daisy", Daisy);
`;

async function build(ac) {
  await ac.audioWorklet.addModule(URL.createObjectURL(new Blob([PROCESSOR], { type: "text/javascript" })));
  const node = new AudioWorkletNode(ac, "daisy", { outputChannelCount: [1], processorOptions: { bytes } });
  const master = new GainNode(ac, { gain: 0.9 });
  node.connect(master);
  return master;
}

const ctx = document.getElementById("cv").getContext("2d");
function idle() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(230,232,238,0.85)";
  ctx.beginPath();
  ctx.moveTo(W / 2 - 30, H / 2 - 40);
  ctx.lineTo(W / 2 + 45, H / 2);
  ctx.lineTo(W / 2 - 30, H / 2 + 40);
  ctx.closePath();
  ctx.fill();
}
idle();

let ac, analyser;
document.getElementById("cv").addEventListener("click", async () => {
  if (ac) {
    if (ac.state === "running") await ac.suspend(); else await ac.resume();
    return;
  }
  ac = new AudioContext({ sampleRate: SR });
  analyser = new AnalyserNode(ac, { fftSize: 2048 });
  (await build(ac)).connect(analyser).connect(ac.destination);
  const wave = new Float32Array(analyser.fftSize);
  (function draw() {
    analyser.getFloatTimeDomainData(wave);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "#4dff7a";
    ctx.shadowColor = "#1fd655";
    ctx.shadowBlur = 8;
    ctx.lineWidth = 2;
    let s0 = 1;
    while (s0 < wave.length / 2 && !(wave[s0 - 1] < 0 && wave[s0] >= 0)) s0++;
    const n = wave.length / 2;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const px = i / (n - 1) * W, py = H / 2 - wave[s0 + i] * H * 0.45;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    requestAnimationFrame(draw);
  })();
});
</script>
</body>
</html>
